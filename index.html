<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jo's Pares Mami – Defend the Cart!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Impact', sans-serif;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      border: 6px solid #000;
      box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
      background: #000;
    }
    #gameCanvas { display: block; width: 100%; height: 100%; }
    
    /* HTML UI OVERLAY */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    }
    .ui-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.4); pointer-events: auto; 
    }
    .comic-box {
      position: relative;
      background: #fff; border: 4px solid #000; padding: 30px;
      box-shadow: 8px 8px 0px #000; text-align: center; max-width: 800px;
    }
    .close-x {
      position: absolute; top: -15px; right: -15px;
      width: 40px; height: 40px; background: #e74c3c; color: #fff;
      border: 4px solid #000; border-radius: 50%;
      font-size: 24px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 4px 4px 0px #000;
    }
    .comic-title {
      font-size: 64px; color: #e74c3c; -webkit-text-stroke: 2px #000;
      margin-bottom: 40px; font-style: italic; font-weight: 900;
    }
    .menu-btn {
      width: 300px; padding: 15px; margin: 10px; font-size: 24px; font-weight: 900;
      border: 4px solid #000; background: #fff; cursor: pointer;
      box-shadow: 5px 5px 0px #000; transition: 0.1s;
    }
    .menu-btn:hover { background: #f1c40f; transform: translate(-2px, -2px); box-shadow: 7px 7px 0px #000; }
    .menu-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
    .menu-btn.red { background: #e74c3c; color: #fff; }
    .menu-btn.green { background: #2ecc71; color: #fff; }
    .menu-btn.yellow { background: #f1c40f; }

    #hud-panel {
      position: absolute; top: 10px; left: 240px; display: none; gap: 10px; pointer-events: none; 
    }
    #hud-panel .game-btn { pointer-events: auto; }

    .game-btn {
      width: 70px; height: 70px; border: 4px solid #000; background: #f1c40f;
      cursor: pointer; font-weight: 900; font-size: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 4px 4px 0px #000;
    }
    .game-btn.selected { background: #2ecc71; border-color: #fff; }
    .game-btn.locked { background: #95a5a6; cursor: not-allowed; opacity: 0.7; }

    #settings-btn-container {
      position: absolute; top: 10px; right: 10px; pointer-events: auto;
      display: flex; gap: 10px;
    }
    .settings-btn, .pause-btn {
      width: 60px; height: 60px; border: 4px solid #000; background: #ecf0f1;
      cursor: pointer; font-size: 30px; display: flex; align-items: center; justify-content: center;
      box-shadow: 4px 4px 0px #000;
    }
    .pause-btn { background: #f1c40f; }

    .volume-container {
      width: 100%; text-align: left; margin-bottom: 20px;
      padding: 10px; border: 2px dashed #000;
    }
    input[type=range] { width: 100%; cursor: pointer; }

    /* PARES MENU BOARD (SHOP) */
    .pares-menu-board {
      background: #fdf5e6;
      border: 8px solid #8b4513;
      padding: 20px;
      width: 900px;
      min-height: 600px;
      box-shadow: 15px 15px 0px rgba(0,0,0,0.6), inset 0 0 50px rgba(139, 69, 19, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .pares-menu-board::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, rgba(139, 69, 19, 0.03) 0px, rgba(139, 69, 19, 0.03) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
    }
    .menu-header {
      text-align: center;
      border-bottom: 4px double #8b4513;
      margin-bottom: 20px;
      padding-bottom: 10px;
    }
    .menu-title {
      font-size: 58px;
      color: #d35400;
      -webkit-text-stroke: 1px #000;
      text-shadow: 3px 3px 0px #f1c40f;
      font-weight: 900;
      margin-bottom: -10px;
    }
    .menu-subtitle {
      font-size: 20px;
      color: #2c3e50;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .kita-display {
      background: #2ecc71;
      border: 4px solid #000;
      padding: 10px 20px;
      align-self: center;
      display: flex;
      gap: 15px;
      box-shadow: 5px 5px 0px #000;
      margin-bottom: 30px;
      transform: rotate(-1deg);
    }
    .kita-label { font-size: 24px; font-weight: 900; color: #fff; }
    .kita-amount { font-size: 24px; font-weight: 900; color: #fff; }

    .menu-sections {
      display: flex;
      gap: 30px;
      flex-grow: 1;
    }
    .menu-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .section-title {
      font-size: 28px;
      color: #c0392b;
      border-bottom: 3px solid #c0392b;
      margin-bottom: 15px;
      font-weight: 900;
    }
    .item-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .menu-item-btn {
      background: #fff;
      border: 3px solid #000;
      padding: 15px;
      text-align: left;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000;
      transition: 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-item-btn:hover:not(:disabled) {
      background: #f1c40f;
      transform: scale(1.02);
    }
    .menu-item-btn:disabled {
      background: #ecf0f1;
      color: #95a5a6;
      border-color: #bdc3c7;
      cursor: not-allowed;
      box-shadow: 2px 2px 0px #bdc3c7;
    }
    .menu-item-btn .item-price {
      color: #27ae60;
    }
    .menu-footer {
      margin-top: 30px;
      text-align: center;
      border-top: 4px double #8b4513;
      padding-top: 20px;
    }
    .footer-hint {
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #7f8c8d;
    }

    .cart {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      pointer-events: none;
      animation: bobbing 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    
    <div id="ui-layer">
      <div id="settings-btn-container">
        <button id="btn-pause-toggle" class="pause-btn">⏸️</button>
        <button id="btn-settings-open" class="settings-btn">⚙️</button>
      </div>

      <div id="screen-main-menu" class="ui-screen">
        <h1 class="comic-title">JO'S PARES MAMI: MAYHEM</h1>
        <button id="btn-new-game" class="menu-btn green">NEW GAME</button>
        <button id="btn-load-game" class="menu-btn yellow">LOAD GAME</button>
        <button id="btn-quit" class="menu-btn red">QUIT</button>
      </div>

      <div id="screen-difficulty" class="ui-screen">
        <h1 class="comic-title" style="color:#f1c40f;">SELECT CHALLENGE</h1>
        <button id="btn-diff-easy" class="menu-btn green">EASY</button>
        <button id="btn-diff-medium" class="menu-btn yellow">MEDIUM</button>
        <button id="btn-diff-hard" class="menu-btn red">HARD</button>
      </div>

      <div id="hud-panel">
        <button id="btn-mami" class="game-btn selected">MAMI</button>
        <button id="btn-pares" class="game-btn locked">PARES</button>
        <button id="btn-rice" class="game-btn locked">RICE</button>
      </div>

      <div id="screen-tutorial" class="ui-screen">
        <div class="comic-box">
          <h2 id="tut-title" style="font-size:32px; color:#f1c40f; margin-bottom:20px;"></h2>
          <p id="tut-text" style="font-size:20px; margin-bottom:30px;"></p>
          <button id="btn-tut-next" class="menu-btn green">CONTINUE</button>
        </div>
      </div>

      <div id="screen-pause" class="ui-screen">
        <div class="comic-box">
          <h1 class="comic-title" style="color:#f1c40f;">GAME PAUSED</h1>
          <button id="btn-resume" class="menu-btn green">RESUME GAME</button>
          <button id="btn-pause-home" class="menu-btn red">QUIT TO HOME</button>
        </div>
      </div>

      <div id="screen-victory" class="ui-screen">
        <div class="comic-box">
          <h1 class="comic-title" style="color:#2ecc71;">WAVE CLEARED!</h1>
          <p id="victory-stats" style="font-size:24px; margin-bottom:20px;"></p>
          <button id="btn-visit-shop" class="menu-btn green">VISIT SHOP</button>
        </div>
      </div>

      <div id="screen-shop" class="ui-screen">
        <div class="pares-menu-board">
          <div class="menu-header">
            <h1 class="menu-title">JO'S PARES & MAMI</h1>
            <p class="menu-subtitle">MENU NG UPGRADE - "THE REAL DEAL"</p>
          </div>
          
          <div class="kita-display">
            <span class="kita-label">KITA:</span>
            <span id="shop-kita" class="kita-amount">₱0</span>
          </div>

          <div class="menu-sections">
            <div class="menu-section">
              <h2 class="section-title">🍜 MGA ULAM (WEAPONS)</h2>
              <div id="shop-items-weapons" class="item-grid">
                <button id="btn-shop-mami" class="menu-item-btn"></button>
                <button id="btn-shop-pares" class="menu-item-btn"></button>
                <button id="btn-shop-rice" class="menu-item-btn"></button>
              </div>
            </div>

            <div class="menu-section">
              <h2 class="section-title">🌶️ SAWSAWAN (SPECIALS)</h2>
              <div id="shop-items-specials" class="item-grid">
                <button id="btn-shop-calamansi" class="menu-item-btn">CALAMANSI (SLOW) - ₱150</button>
                <button id="btn-shop-chili" class="menu-item-btn">CHILI (BURN) - ₱200</button>
              </div>
            </div>
          </div>

          <div class="menu-footer">
            <button id="btn-shop-done" class="menu-btn green">LUTO NA! (START NEXT WAVE)</button>
            <p class="footer-hint">PRESS [1-5] TO UPGRADE | [ENTER] TO CONTINUE</p>
          </div>
        </div>
      </div>

      <div id="screen-settings" class="ui-screen">
        <div class="comic-box" style="width: 450px;">
          <button id="btn-settings-x" class="close-x">X</button>
          <h1 class="comic-title" style="font-size:48px; color:#34495e; margin-bottom:20px;">SETTINGS</h1>
          
          <div class="volume-container">
            <label style="font-weight:900; font-size:18px;">SOUND VOLUME</label>
            <input type="range" id="slider-volume" min="0" max="1" step="0.1" value="0.5">
          </div>
          
          <button id="btn-save-game" class="menu-btn yellow" style="width:100%;">SAVE PROGRESS</button>
          <button id="btn-back-home" class="menu-btn yellow" style="width:100%;">BACK TO HOME</button>
          <button id="btn-reset-save" class="menu-btn red" style="width:100%; font-size:18px;">RESET ALL DATA</button>
          <button id="btn-settings-close" class="menu-btn green" style="width:100%;">BACK TO GAME</button>
        </div>
      </div>

      <div id="screen-gameover" class="ui-screen">
        <div class="comic-box">
          <h1 class="comic-title">GAME OVER!</h1>
          <button id="btn-restart" class="menu-btn red">RESTART</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils/Constants.js"></script>
  <script src="js/utils/Physics.js"></script>
  <script src="js/core/AssetLoader.js"></script>
  <script src="js/core/SaveManager.js"></script>
  <script src="js/core/InputHandler.js"></script>
  <script src="js/entities/Player.js"></script>
  <script src="js/entities/Enemy.js"></script>
  <script src="js/entities/Projectiles.js"></script>
  <script src="js/managers/LevelManager.js"></script>
  <script src="js/managers/WaveManager.js"></script>
  <script src="js/managers/ShopManager.js"></script>
  <script src="js/managers/UIManager.js"></script>
  <script src="js/core/Game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
